{% extends 'OILFIELD/base_oilfield.html' %}
{% block title %}Eliminar Batería{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body text-center p-5">
                <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                <h5 class="font-weight-bolder mb-1">Eliminar Batería</h5>
                <p class="text-secondary mb-1">¿Deseas eliminar la batería <strong>{{ object.Code }} – {{ object.Name }}</strong>?</p>
                <p class="text-xs text-danger">Esta acción eliminará todos los registros asociados.</p>
                <form method="post" class="mt-3 d-flex justify-content-center gap-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger mb-0">Sí, eliminar</button>
                    <a href="{% url 'oilfield_app:battery_list' %}" class="btn btn-outline-secondary mb-0">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
