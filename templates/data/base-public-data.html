{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="76x76" href="{% static 'assets/img/logo-ct.png' %}">
    <link rel="icon" type="image/png" href="{% static 'assets/img/logo-ct.png' %}">
    <title>Data Green</title>
    <!-- Bootstrap CSS -->
    <link id="pagestyle" href="{% static 'assets/css/material-dashboard.css' %}" rel="stylesheet" />
    <!-- Font Awesome para iconos -->
    <!-- Leaflet para mapas -->
    <link rel="stylesheet" href="{% static 'assets/css/leaflet.css' %}" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #ecf0f4;
        }
        .card {
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-10px);
        }
        .stat-card {
            text-align: center;
            padding: 15px;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #494b4e;
        }
        #map {
            height: 400px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .sidebar {
            background-color: #fff;
            height: 100%;
            border-right: 1px solid #dee2e6;
        }
        .img-container {
            height: 400px;
            overflow: hidden;
            border-radius: 8px;
        }
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .station-selector {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .station-selector:hover {
            background-color: #f1f1f1;
        }
        .station-active {
            background-color: #e2f0fd;
            border-left: 4px solid #0d6efd;
        }
        .map-marker-active {
            filter: hue-rotate(120deg) brightness(1.2);
            transform: scale(1.3);
            transition: all 0.3s ease;
        }
        .nav-tabs .nav-link.active {
            font-weight: bold;
            border-bottom: 3px solid #0d6efd;
        }
        .station-type-selector {
            font-weight: bold;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .station-type-btn {
            width: 100%;
            margin-bottom: 10px;
        }
        .wind-direction {
            display: inline-block;
            transition: transform 0.5s ease;
        }
        .historical-chart-container {
            height: 300px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .sidebar {
                height: auto;
                border-right: none;
                border-bottom: 1px solid #dee2e6;
            }
        }
        /* Navegación */
        .nav-tabs {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            border-bottom: 1px solid #ddd;
        }
        
        .nav-tabs li {
            margin-right: 5px;
        }
        
        .nav-tabs a {
            display: block;
            padding: 10px 15px;
            text-decoration: none;
            color: #666;
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
        }
        
        .nav-tabs a.active {
            background-color: #fff;
            color: #333;
            border-bottom: 1px solid #fff;
            margin-bottom: -1px;
            font-weight: bold;
        }
        
        /* Contenido */
        .content-container {
            position: relative;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 0 0 5px 5px;
            min-height: 200px;
        }
        
        .content-div {
            display: none; /* Todos los divs ocultos por defecto */
        }
        
        .content-div.active {
            display: block; /* Solo mostrar el div activo */
        }
    </style>
</head>
<body>
    
    {% block content %}

    {% endblock content %}

    {% block JSscripts %}
    {% endblock JSscripts %}

    <script src="{% static 'assets/js/core/popper.min.js' %}"></script>
    <script src="{% static 'assets/js/core/bootstrap.min.js' %}"></script>
    <script src="{% static 'assets/js/plugins/perfect-scrollbar.min.js' %}"></script>
    <script src="{% static 'assets/js/plugins/smooth-scrollbar.min.js' %}"></script>
    <script src="{% static 'assets/js/plugins/choices.min.js' %}"></script>

    <script src="{% static 'assets/js/plugins/datatables.js' %}"></script>
    <script src="{% static 'assets/js/plugins/dragula/dragula.js' %}"></script>
    <script src="{% static 'assets/js/plugins/countup.min.js' %}"></script>

</body>
</html>
